<!DOCTYPE html>
<html lang="ja" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>板一覧（ドロワー / セレクター） - PC直系フラット × ChMate操作感</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#051424',
            'surface-dim': '#051424',
            'surface-bright': '#1e2e42',
            'surface-container-lowest': '#010f1f',
            'surface-container-low': '#08192b',
            'surface-container': '#0d1f35',
            'surface-container-high': '#142740',
            'surface-container-highest': '#1c3352',
            primary: '#3b82f6',
            'primary-hover': '#2563eb',
            'primary-subtle': '#1d4ed8',
            'border-subtle': '#182b42',
            'border-light': '#223854',
            'text-primary': '#e2e8f0',
            'text-secondary': '#94a3b8',
            'text-muted': '#64748b',
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #051424;
    }
    ::-webkit-scrollbar-thumb {
      background: #1c3352;
      border-radius: 2px;
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-text-primary font-sans antialiased h-full flex justify-center selection:bg-primary selection:text-white">
  <!-- Mobile Container -->
  <div class="relative w-full max-w-[420px] h-full flex flex-col bg-surface overflow-hidden shadow-2xl border-x border-border-subtle">

    <!-- Header (ChMate & PC直系) -->
    <header class="flex items-center justify-between px-3 py-2.5 bg-surface-container border-b border-border-subtle z-20 shrink-0">
      <div class="flex items-center gap-2">
        <button class="p-1.5 -ml-1 text-text-secondary hover:text-text-primary hover:bg-surface-container-high rounded transition-colors" aria-label="戻る">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
          </svg>
        </button>
        <span class="font-bold text-base tracking-wide text-text-primary">板一覧</span>
      </div>
      <div class="flex items-center gap-1">
        <button class="p-1.5 text-text-secondary hover:text-text-primary hover:bg-surface-container-high rounded transition-colors" aria-label="並び替え・編集">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
        <button class="p-1.5 text-text-secondary hover:text-text-primary hover:bg-surface-container-high rounded transition-colors" aria-label="更新">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Input Bar (No emoji, clean svg icon) -->
    <div class="px-3 py-2 bg-surface-container-low border-b border-border-subtle shrink-0">
      <div class="relative flex items-center">
        <svg class="w-4 h-4 absolute left-2.5 text-text-muted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <input type="text" placeholder="板名・キーワード絞り込み..." class="w-full pl-8 pr-7 py-1.5 text-xs bg-surface-container-lowest border border-border-subtle rounded focus:outline-none focus:border-primary text-text-primary placeholder:text-text-muted transition-colors font-sans">
        <button class="absolute right-2 text-text-muted hover:text-text-secondary" aria-label="クリア">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Tab Strip (お気に入り / 履歴 / すべてのカテゴリ) -->

      <button class="px-3 py-1.5 text-primary border-b-2 border-primary font-semibold flex items-center gap-1.5 whitespace-nowrap">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
        </svg>
        <span>お気に入り (4)</span>

      <button class="px-3 py-1.5 text-text-secondary hover:text-text-primary border-b-2 border-transparent flex items-center gap-1.5 whitespace-nowrap transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>閲覧履歴</span>
      </button>
      <button class="px-3 py-1.5 text-text-secondary hover:text-text-primary border-b-2 border-transparent flex items-center gap-1.5 whitespace-nowrap transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>

      </button>
    </div>

    <!-- Board Category & List Scroll Area -->
    <main class="flex-1 overflow-y-auto divide-y divide-border-subtle select-none">
      
      <!-- Section 1: ピン留め・お気に入り板 -->
      <div>
        <div class="flex items-center justify-between px-3 py-1.5 bg-surface-container-low/80 text-[11px] font-semibold text-text-muted uppercase tracking-wider">
          <span class="flex items-center gap-1">
            <svg class="w-3 h-3 text-primary" fill="currentColor" viewBox="0 0 24 24">
              <path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />

            お気に入り
          </span>
          <span class="font-mono text-[10px] text-text-muted">4 板</span>
        </div>

        <div class="divide-y divide-border-subtle/60">
          <!-- Active Current Board -->
          <a href="#" class="flex items-center justify-between px-3 py-2.5 bg-primary/10 border-l-2 border-primary hover:bg-primary/15 transition-colors group">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-2 h-2 rounded-full bg-primary shrink-0"></div>
              <div class="truncate">
                <div class="text-sm font-semibold text-text-primary group-hover:text-primary transition-colors flex items-center gap-1.5">
                  <span>テスト01板</span>
                  <span class="text-[10px] font-mono px-1 py-0.2 bg-primary/20 text-primary rounded">現在閲覧中</span>
                </div>
                <div class="text-[11px] text-text-muted font-mono mt-0.5">test01 / 58スレッド</div>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-xs font-mono text-primary font-medium">+18未読</span>
              <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </a>

          <!-- Other Favorite Board -->
          <a href="#" class="flex items-center justify-between px-3 py-2.5 hover:bg-surface-container-low transition-colors group">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-2 h-2 rounded-full bg-border-light shrink-0"></div>
              <div class="truncate">
                <div class="text-sm font-medium text-text-primary group-hover:text-primary transition-colors">雑談・避難所板</div>
                <div class="text-[11px] text-text-muted font-mono mt-0.5">chat / 142スレッド</div>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-xs font-mono text-text-muted">勢い 3,840</span>
              <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </a>

          <a href="#" class="flex items-center justify-between px-3 py-2.5 hover:bg-surface-container-low transition-colors group">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-2 h-2 rounded-full bg-border-light shrink-0"></div>
              <div class="truncate">
                <div class="text-sm font-medium text-text-primary group-hover:text-primary transition-colors">プログラミング・技術板</div>
                <div class="text-[11px] text-text-muted font-mono mt-0.5">tech / 89スレッド</div>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-xs font-mono text-primary font-medium">+3未読</span>
              <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </a>

          <a href="#" class="flex items-center justify-between px-3 py-2.5 hover:bg-surface-container-low transition-colors group">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-2 h-2 rounded-full bg-border-light shrink-0"></div>
              <div class="truncate">
                <div class="text-sm font-medium text-text-primary group-hover:text-primary transition-colors">UI・デザイン制作板</div>
                <div class="text-[11px] text-text-muted font-mono mt-0.5">design / 34スレッド</div>
              </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-xs font-mono text-text-muted">勢い 890</span>
              <svg class="w-4 h-4 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </div>
          </a>
        </div>
      </div>

      <!-- Section 2: カテゴリ（アコーディオン） - 開発・技術 -->
      <div>
        <button class="w-full flex items-center justify-between px-3 py-2 bg-surface-container-low text-xs font-semibold text-text-secondary hover:text-text-primary transition-colors">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-text-muted transform rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
            <span>開発・インターネット (6)</span>
          </span>
          <span class="font-mono text-[10px] text-text-muted">OPEN</span>
        </button>

        <div class="divide-y divide-border-subtle/60 pl-2">
          <a href="#" class="flex items-center justify-between px-3 py-2.5 hover:bg-surface-container-low transition-colors group">
            <div class="truncate">
              <div class="text-sm font-medium text-text-primary group-hover:text-primary transition-colors">Webフロントエンド</div>
              <div class="text-[11px] text-text-muted font-mono mt-0.5">frontend / 45スレ</div>
            </div>
            <span class="text-xs font-mono text-text-muted">勢い 420</span>
          </a>

          <a href="#" class="flex items-center justify-between px-3 py-2.5 hover:bg-surface-container-low transition-colors group">
            <div class="truncate">

              <div class="text-[11px] text-text-muted font-mono mt-0.5">server / 27スレ</div>
            </div>
            <span class="text-xs font-mono text-text-muted">勢い 180</span>
          </a>

          <a href="#" class="flex items-center justify-between px-3 py-2.5 hover:bg-surface-container-low transition-colors group">
            <div class="truncate">
              <div class="text-sm font-medium text-text-primary group-hover:text-primary transition-colors">自作掲示板・PWA開発</div>
              <div class="text-[11px] text-text-muted font-mono mt-0.5">bbsdev / 61スレ</div>
            </div>

      <!-- Section 3: カテゴリ - カルチャー・生活 -->
      <div>
        <button class="w-full flex items-center justify-between px-3 py-2 bg-surface-container-low text-xs font-semibold text-text-secondary hover:text-text-primary transition-colors">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-text-muted transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
            <span>趣味・カルチャー (8)</span>
          </span>
          <span class="font-mono text-[10px] text-text-muted">CLOSED</span>
        </button>
      </div>

      <!-- Section 4: カテゴリ - 運営・総合 -->
      <div>
        <button class="w-full flex items-center justify-between px-3 py-2 bg-surface-container-low text-xs font-semibold text-text-secondary hover:text-text-primary transition-colors">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-text-muted transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
            <span>運営・ガイドライン (3)</span>
          </span>
          <span class="font-mono text-[10px] text-text-muted">CLOSED</span>
        </button>
      </div>
    </main>

    <!-- Bottom Toolbar (ChMate準拠 & PC直系) -->
    <footer class="bg-surface-container border-t border-border-subtle px-3 py-2 shrink-0 safe-bottom">
      <div class="flex items-center justify-between text-xs text-text-secondary">
        <button class="flex items-center gap-1.5 py-1 px-2.5 hover:bg-surface-container-high rounded text-text-primary transition-colors">
          <svg class="w-4 h-4 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>板を追加</span>
        </button>

        <div class="flex items-center gap-1">
          <button class="p-1.5 hover:bg-surface-container-high rounded text-text-secondary hover:text-text-primary transition-colors" title="すべて既読">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          </button>
          <button class="p-1.5 hover:bg-surface-container-high rounded text-text-secondary hover:text-text-primary transition-colors" title="設定">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

  </div>
